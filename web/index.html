<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="بركة — كل ما تتمنوه تحت سقف واحد">
  <meta name="theme-color" content="#071F49">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="بركة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>بركة | BARAKAH</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>

  <script>
    // Remove Flutter's retired offline cache once so previously opened phones
    // receive the newest UI. Keep Firebase Messaging's worker registered.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(async (registrations) => {
        let removedFlutterWorker = false;
        for (const registration of registrations) {
          const workers = [
            registration.active,
            registration.waiting,
            registration.installing,
          ].filter(Boolean);
          const isFlutterWorker = workers.some((worker) =>
            worker.scriptURL.includes('flutter_service_worker.js')
          );
          if (isFlutterWorker) {
            removedFlutterWorker = (await registration.unregister()) || removedFlutterWorker;
          }
        }
        if (removedFlutterWorker && !sessionStorage.getItem('barakah-cache-cleared')) {
          sessionStorage.setItem('barakah-cache-cleared', '1');
          window.location.reload();
        }
      });
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope',
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
