<body>

  <script>
    (async () => {
      // Wait until Flutter's retired offline cache is gone before loading the
      // application. Firebase Messaging keeps its own isolated worker.
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const registration of registrations) {
          const workers = [
            registration.active,
            registration.waiting,
            registration.installing,
          ].filter(Boolean);
          const isFlutterWorker = workers.some((worker) =>
            worker.scriptURL.includes('flutter_service_worker.js')
          );
          if (isFlutterWorker) {
            await registration.unregister();
          }
        }

        await navigator.serviceWorker.register('/firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope',
        });
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = '/flutter_bootstrap.js?v=20260901-1055';
      document.body.appendChild(bootstrap);
    })();
  </script>
